<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Elf workshop · Review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171e24;color:#eee9df;font:14px system-ui,sans-serif}header{position:absolute;top:22px;left:26px;right:26px;display:flex;align-items:center;gap:20px;pointer-events:none}h1{font-size:20px;margin:0;font-weight:550}small{color:#9caab4}header span{margin-left:auto;color:#b8c7ae}aside{position:absolute;top:95px;left:26px;width:220px;padding:18px;background:#222b33ed;border:1px solid #43505a;border-radius:12px}label{display:block;margin:15px 0 7px;color:#b9c5ce}select,button{font:inherit;color:inherit;background:#303d48;border:1px solid #53616a;border-radius:6px;padding:9px;cursor:pointer}select{width:100%}button:hover{background:#435462}.views{display:flex;gap:5px;margin-top:16px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:8px}footer{position:absolute;left:26px;bottom:22px;right:26px;display:flex;justify-content:space-between;gap:20px;color:#a9b8c3;pointer-events:none}#status{color:#d9e7cc;margin-top:14px;font-size:12px;overflow-wrap:anywhere}#details{font-size:12px;line-height:1.6;color:#afbdc7;margin-top:14px}canvas{display:block;width:100vw;height:100vh}#error{color:#ffc1a7} @media(max-width:650px){aside{top:76px;left:12px;width:175px;padding:12px}header{left:12px;top:16px}footer{font-size:11px;left:12px}header span{display:none}}
</style>
<style>#piece-label{position:fixed;z-index:5;pointer-events:none;background:#20262bef;border:1px solid #ff8c20;border-radius:7px;padding:10px 13px;box-shadow:0 4px 20px #0008}#piece-name{color:#ffb66b;display:block}#piece-reference{display:block;font-size:12px;color:#cad2d8;margin-top:4px}#piece-label[hidden]{display:none}</style>
<script type="importmap">{"imports":{"three":"/vendor/build/three.module.js","three/addons/":"/vendor/examples/jsm/"}}</script></head>
<body><header><div><h1>Elf workshop</h1><small>Model review</small></div><span>Visual preview</span></header>
<aside><strong>Review model</strong><label for="figure">Figure</label><select id="figure"><option value="all">Full regiment</option></select><label for="part">Component</label><select id="part"><option value="all">All components</option></select>
<label class="check"><input type="checkbox" id="shields" checked> Show shields</label><label class="check"><input type="checkbox" id="outlines" checked> Edge outlines</label><label class="check"><input type="checkbox" id="wire"> Wireframe</label>
